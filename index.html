<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>BPQ Planification</title>
  <!-- viewport-fit=cover : le contenu s'étend sous la barre de statut / Dynamic Island.
       maximum-scale=1 : empêche le zoom involontaire dans une app plein écran. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">

  <!-- ── Le correctif de la barre blanche ──
       Cette page est le document de PREMIER NIVEAU : c'est celle-ci qu'iOS lit pour teindre
       la barre de statut. On la déclare noire, ce que l'enveloppe Apps Script (blanche) ne
       permettait pas. black-translucent = barre de statut transparente par-dessus notre noir. -->
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BPQ">

  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    html, body { margin: 0; padding: 0; height: 100vh; height: 100dvh; background: #0a0a0a; overflow: hidden; }
    /* ── La bande morte en bas de l'écran ──
       height:100% se résolvait sur la zone SÛRE en mode standalone iOS : l'iframe
       s'arrêtait au-dessus de l'indicateur d'accueil et laissait une bande noire
       inerte de ~60px en bas, hors du document de l'app (donc ni cliquable, ni
       défilable, sans la texture de fond). 100vh/100dvh, eux, comptent bien
       jusqu'au bord physique avec viewport-fit=cover.
       100dvh est déclaré après 100vh : les navigateurs qui ne le connaissent pas
       gardent 100vh, les autres suivent en plus les changements de barre. */
    #app {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      border: 0; background: transparent; display: block;
    }
    /* Filet visuel : même trame de cubes que l'app derrière l'iframe. Si un résidu de
       bande subsiste malgré la mesure JS ci-dessous, il se fond dans le décor au lieu
       de lire comme un aplat mort. */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; background: #0a0a0a;
      background-image:
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 46px 46px;
    }
    /* Splash affiché tant que l'app n'a pas fini de charger (fondu à la fin). */
    #splash {
      position: fixed; top: 0; left: 0; z-index: 2; background: #0a0a0a;
      width: 100vw; height: 100vh; height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.45s ease; opacity: 1;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img { width: min(240px, 58vw); height: auto; }
  </style>
</head>
<body>
  <div id="splash"><img src="logo_white.png" alt="BPQ"></div>

  <iframe id="app"
          src="https://script.google.com/macros/s/AKfycbzew2PylreWUU1XAH4fYYq5yCZh29zOQ2QXzWU0yr1sZRYH0XILoC_TWjVqVQEoXMqh/exec"
          title="BPQ Planification"
          allow="camera; microphone; clipboard-read; clipboard-write; geolocation; fullscreen"
          allowfullscreen></iframe>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      var app = document.getElementById('app');

      // ── Hauteur de l'iframe mesurée, pas déduite du CSS ──
      // 100vh/100dvh se sont révélés insuffisants en standalone iOS : l'iframe s'arrêtait
      // au-dessus de l'indicateur d'accueil et laissait une bande noire inerte. On mesure
      // donc la hauteur réellement visible et on la pose en pixels. visualViewport est la
      // source la plus fiable ; innerHeight sert de repli.
      function fit() {
        var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        if (!h) return;
        app.style.height = h + 'px';
        splash.style.height = h + 'px';
      }
      fit();
      addEventListener('resize', fit);
      addEventListener('orientationchange', function () { setTimeout(fit, 250); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
      // Le passage en plein écran standalone peut arriver après le premier paint.
      setTimeout(fit, 300);
      setTimeout(fit, 1200);

      // Masque le splash quand l'app est chargée (ou après un délai de sécurité).
      function hide() { splash.classList.add('hidden'); }
      app.addEventListener('load', hide);
      setTimeout(hide, 7000);
    })();
  </script>
</body>
</html>
