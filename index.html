<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>BPQ Planification</title>
  <!-- viewport-fit=cover : le contenu s'étend sous la barre de statut / Dynamic Island.
       maximum-scale=1 : empêche le zoom involontaire dans une app plein écran. -->
  <!-- maximum-scale/user-scalable retirés : ils bloquaient le zoom (problème d'accessibilité)
       sans rien apporter en standalone, et sont soupçonnés de perturber viewport-fit=cover. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- ── Le correctif de la barre blanche ──
       Cette page est le document de PREMIER NIVEAU : c'est celle-ci qu'iOS lit pour teindre
       la barre de statut. On la déclare noire, ce que l'enveloppe Apps Script (blanche) ne
       permettait pas. black-translucent = barre de statut transparente par-dessus notre noir. -->
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BPQ" id="titreIcone">

  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    /* ══ LA BANDE MORTE EN BAS : la cause était `position: fixed` ══
       Mesuré sur l'appareil. Avec l'iframe en position:fixed, iOS standalone donnait
       innerHeight = 812 pour un écran de 874 : un élément fixed est borné au viewport
       de MISE EN PAGE, qui exclut 62px (la hauteur de la Dynamic Island), et rien —
       ni 100vh, ni 100dvh, ni le fond de la racine — n'atteignait cette zone.
       En position:absolute avec une hauteur explicite de screen.height, le document
       dépasse le viewport de mise en page ; iOS étend alors le viewport VISUEL à tout
       l'écran (innerHeight passe à 874, écart 0) et le contenu descend jusqu'au bord.
       Donc : pas de `overflow: hidden` ici (il rognerait ces 62px) et surtout pas de
       retour à position:fixed. */
    html, body { margin: 0; padding: 0; }
    html {
      background-color: #0a0a0a;
      overscroll-behavior: none;   /* pas de rebond sur les 62px de débord */
    }
    body { background: transparent; overscroll-behavior: none; }
    #app {
      position: absolute; top: 0; left: 0;
      width: 100%;                 /* hauteur posée en px par fit() */
      border: 0; background: transparent; display: block;
    }
    /* Splash affiché tant que l'app n'a pas fini de charger (fondu à la fin). */
    #splash {
      position: absolute; top: 0; left: 0; z-index: 2; background: #0a0a0a;
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.45s ease; opacity: 1;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img { width: min(240px, 58vw); height: auto; }
  </style>
</head>
<body>
  <div id="splash"><img src="logo_white.png" alt="BPQ"></div>

  <!-- ── QUEL PROJET APPS SCRIPT CETTE COQUILLE SERT ──
       Repointé le 2026-08-21. Cette ligne visait encore AKfycbzew2Pylre…QEoXMqh, le
       déploiement de l'ANCIEN projet, déclaré obsolète à la bascule du 2026-08-20.
       La coquille servait donc l'app au bandeau rouge — alors les gens ouvraient la
       nouvelle URL /exec directement dans Safari, et tout ce que cette page apporte
       disparaissait d'un coup. Voir demande explicite : « depuis qu'on a switcher à la
       nouvelle app web, la barre blanche est revenu quand j'enregistre comme une app
       dans mon écran d'iPhone et sur la tablette je ne suis plus capable de mettre
       l'app sur le bureau avec le logo et il garde la barre web en tête ».

       Pourquoi l'URL /exec nue ne peut PAS remplacer cette page : là-bas le document
       de premier niveau est l'enveloppe générée par Google, et HtmlService.addMetaTag()
       n'accepte que « viewport » (voir la NOTE dans doGet, Code.js de bpq-planification).
       Donc pas d'apple-touch-icon (iOS met une capture d'écran à la place du logo), pas
       de display standalone (l'icône rouvre le navigateur avec sa barre), pas de
       theme-color (la barre blanche). Les trois symptômes n'en font qu'un : on
       n'installait plus la coquille.

       L'ID ci-dessous est le déploiement EN SERVICE (app.bpq.ca). Il est apparié au
       projet dans bpq-planification/hooks/clasp-cible.ps1 et dans son CLAUDE.md
       § « IL Y A DEUX PROJETS ». Changer de déploiement là-bas sans changer cette
       ligne ici ramène exactement la panne du 2026-08-21 — et rien ne le signalera :
       ce dépôt n'a ni clasp, ni pre-push, ni aucun des 10 contrôles. -->
  <iframe id="app"
          src="https://script.google.com/macros/s/AKfycbxOsJhObowJjHXim2cFl4JN6Uzq2eFrj7B0AZmrxhCwr8FtVIS9ur9y9JT1XPqdPdEh/exec"
          title="BPQ Planification"
          allow="camera; microphone; clipboard-read; clipboard-write; geolocation; fullscreen"
          allowfullscreen></iframe>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      var app = document.getElementById('app');

      // ══════════════════════════════════════════════════════════════════════════════
      // ⛔ CHAQUE KIOSQUE A SON ADRESSE — `?poste=<id>` (2026-09-21)
      // ══════════════════════════════════════════════════════════════════════════════
      //
      // Demande : « je veux que chaque kiosque s'installe manuellement chacun, pas "installer
      // en mode kiosque" — ça règle beaucoup de problèmes de relogin et tout. Comme ça chaque
      // kiosque est autonome. »
      //
      // CE QUI NE MARCHAIT PAS, ET C'EST CETTE PAGE-CI QUI MANQUAIT. Depuis le 2026-09-17,
      // l'app envoie le POSTE avec le jeton (`kiosk-set` porte un champ `page`) et le
      // redemande au démarrage. Cette coquille est restée au commit du 2026-08-21 : elle
      // ignorait `page` et n'en renvoyait aucun. L'app recevait donc toujours une page vide,
      // retombait sur le localStorage de l'iframe — mort sur iPad — puis sur le premier poste
      // de sa table. TOUTES les tablettes repartaient sur Manutention à chaque redémarrage,
      // quel que soit le poste installé. Rien ne le signalait : la tablette avait simplement
      // l'air installée sur autre chose.
      //
      // DEUX CORRECTIONS, ET L'ORDRE EST VOULU :
      //   1. L'ADRESSE. On ouvre `…/bpq-app/?poste=batching` et on l'ajoute à l'écran
      //      d'accueil : iOS retient l'URL COURANTE comme point de départ de l'icône. Le
      //      poste vit alors dans le document de PREMIER NIVEAU, qui traverse un
      //      redémarrage, une coupure de courant et un nettoyage de Safari. C'est ce qui rend
      //      chaque kiosque autonome — il n'y a plus rien à perdre.
      //   2. Le rangement (plus bas), pour les tablettes déjà installées sans adresse :
      //      personne ne va toutes les refaire le jour de la livraison.
      //
      // ⚠ LE POSTE N'OUVRE AUCUNE PORTE. Il dit ce que la tablette AFFICHE ; c'est le jeton,
      // vérifié côté serveur, qui décide de ce qu'elle a le droit de faire. Une adresse
      // fabriquée à la main ne donne donc rien de plus qu'une adresse.
      //
      // ⚠ LA LISTE DES NOMS CI-DESSOUS NE SERT QU'À NOMMER L'ICÔNE. La table qui fait
      // autorité est `KIOSK_POSTES` (bpq-planification, ui/Js-01) : c'est l'app qui valide
      // l'id et qui décide du poste. Un id absent d'ici ne casse rien — l'icône s'appelle
      // « BPQ », et l'app ouvre quand même le bon poste.
      var POSTE_NOMS = {
        manutention: 'Manutention', production: 'Production', ferrailleur: 'Ferraillage',
        inspection: 'Inspection', punch: 'Punch', cnckiosque: 'CNC',
        usine: 'Batching', calendrier: 'Superviseur'
      };
      function posteDeLAdresse() {
        try {
          var m = /[?&]poste=([A-Za-z0-9_-]+)/.exec(location.search || '');
          return m ? m[1].toLowerCase() : '';
        } catch (e) { return ''; }
      }
      var POSTE = posteDeLAdresse();

      if (POSTE) {
        // ── L'APP REÇOIT LE POSTE DANS SON URL ──
        // ⚠ ON RÉÉCRIT `src`, ON NE LE REMPLACE PAS DANS LE HTML. L'attribut `src` du
        // document porte l'ID du déploiement en clair, et c'est LUI que le contrôle de
        // CLAUDE.md relit (`grep -o 'src="[^"]*AKfycb[^"]*"'`) pour vérifier que la coquille
        // sert le bon projet. Le déplacer dans un attribut à nous rendrait ce contrôle muet —
        // il répondrait « rien », ce qui se lit comme « coquille périmée ».
        // Le coût est une requête abandonnée quand un poste est nommé. Elle n'est pas perdue :
        // elle réveille l'instance Apps Script, dont le démarrage à froid est de 8 à 9 s.
        try {
          var base = app.getAttribute('src') || '';
          app.src = base + (base.indexOf('?') >= 0 ? '&' : '?') + 'kiosque=' + encodeURIComponent(POSTE);
        } catch (e) {}

        // ── L'ICÔNE PORTE LE NOM DU POSTE ──
        // Huit icônes « BPQ » sur huit tablettes ne se distinguent pas, et c'est le moment où
        // quelqu'un installe qui décide pour des mois. iOS lit cette balise AU MOMENT d'ajouter
        // à l'écran d'accueil : la poser ici suffit, la page est déjà chargée.
        var nom = POSTE_NOMS[POSTE] || '';
        if (nom) {
          try {
            var t = document.getElementById('titreIcone');
            if (t) t.setAttribute('content', 'BPQ ' + nom);
            document.title = 'BPQ ' + nom;
          } catch (e) {}
        }

        // ── ET LE MANIFESTE SUIT, POUR CHROME ──
        // iOS n'en a pas besoin : il retient l'URL courante. Chrome, lui, repart du
        // `start_url` du manifeste — il perdrait donc le poste à chaque ouverture de l'icône.
        // C'est le cas de la TV du superviseur, qui s'installe depuis Chrome. On réécrit donc
        // le manifeste en mémoire, avec le poste dedans.
        // ⚠ ENTIÈREMENT DANS UN try : un navigateur qui refuse un manifeste `blob:` doit
        // perdre la personnalisation de l'icône, jamais la page.
        try {
          fetch('manifest.webmanifest').then(function (r) { return r.json(); }).then(function (m) {
            m.start_url = './?poste=' + encodeURIComponent(POSTE);
            if (nom) { m.name = 'BPQ ' + nom; m.short_name = nom; }
            var lien = document.querySelector('link[rel="manifest"]');
            if (lien) lien.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
          }).catch(function () {});
        } catch (e) {}
      }

      // ── Hauteur de l'iframe mesurée, pas déduite du CSS ──
      // 100vh/100dvh se comportaient mal selon le mode ; on mesure donc la hauteur
      // réellement visible et on la pose en pixels, re-mesurée au resize et à la rotation.
      function estStandalone() {
        if (navigator.standalone === true) return true;                       // iOS
        try { return matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; }
      }

      function fit() {
        var vv = (window.visualViewport && window.visualViewport.height) || 0;
        var ih = window.innerHeight || 0;
        var sc = window.screen || {};
        var seul = estStandalone();
        var ecran = 0;
        if (sc.height && sc.width) {
          var portrait = ih >= (window.innerWidth || 0);
          ecran = portrait ? Math.max(sc.height, sc.width) : Math.min(sc.height, sc.width);
        }
        // En standalone, l'iframe doit faire la hauteur de l'ÉCRAN : c'est ce débord au-delà
        // du viewport de mise en page qui fait étendre le viewport visuel à tout l'écran.
        // Dans un navigateur, au contraire, la barre d'adresse occupe légitimement le bas :
        // on s'en tient à la hauteur visible, sinon le bas de l'app passe dessous.
        var h = seul ? Math.max(vv, ih, ecran) : Math.max(vv, ih);
        if (!h) return;
        app.style.height = h + 'px';
        splash.style.height = h + 'px';
        if (diag) {
          diag.textContent = (seul ? 'STANDALONE' : 'navigateur')
            + ' · inner ' + ih + ' · visual ' + Math.round(vv)
            + ' · screen ' + (sc.height || '?') + '×' + (sc.width || '?')
            + ' · dpr ' + (window.devicePixelRatio || '?') + ' → iframe ' + Math.round(h);
        }
      }
      // Lecture des mesures à l'écran, seulement avec ?debug=1 — pour diagnostiquer sur
      // l'appareil sans avoir à le brancher.
      var diag = null;
      if (/[?&]debug=1/.test(location.search)) {
        diag = document.createElement('div');
        diag.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;'
          + 'font:11px/1.4 -apple-system,sans-serif;color:#7cc4ff;background:rgba(0,0,0,0.8);'
          + 'border:1px solid rgba(124,196,255,0.4);border-radius:8px;padding:6px 8px;text-align:center';
        document.body.appendChild(diag);
      }
      fit();
      addEventListener('resize', fit);
      addEventListener('orientationchange', function () { setTimeout(fit, 250); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
      // Le passage en plein écran standalone peut arriver après le premier paint.
      setTimeout(fit, 300);
      setTimeout(fit, 1200);

      // Masque le splash quand l'app est chargée (ou après un délai de sécurité).
      function hide() { splash.classList.add('hidden'); }
      app.addEventListener('load', hide);
      setTimeout(hide, 7000);

      // ── Rechargement demandé par l'app (écran noir au réveil) ──
      // L'app tourne dans l'iframe bac à sable d'Apps Script (`userCodeAppPanel`), dont l'URL
      // est signée et à usage unique : un location.reload() DEPUIS L'INTÉRIEUR retombe souvent
      // sur un cadre vide — l'écran noir dont on ne sortait qu'en redémarrant le téléphone.
      // C'est la coquille qui doit recharger, avec l'URL /exec, elle stable. L'app envoie donc
      // { bpq: 'reload' } (voir _bpqReload_ dans Assignation.html) et on la sert ici.
      //
      // Le message vient du bac à sable INTERNE (googleusercontent.com), pas de l'iframe
      // directe : on ne peut donc pas comparer e.source à app.contentWindow, il faut filtrer
      // sur l'origine. La seule action possible reste de recharger notre propre iframe sur son
      // URL d'origine — aucune donnée n'est lue ni transmise.
      function origineGoogle(o) {
        return o === 'https://script.google.com'
          || /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(o);
      }
      // ── Jeton du poste kiosque (la tablette du chariot élévateur) ──
      // Le stockage de l'app vit dans le bac à sable Apps Script : origine TIERCE, et
      // regénérée à chaque chargement de /exec. Un jeton écrit là ne survit pas au
      // rechargement, et Safari sur iPad refuse même de l'écrire (« Empêcher le suivi entre
      // sites », actif par défaut). C'est ce qui rendait l'installation impossible : la
      // tablette acceptait le code puis revenait à l'écran de connexion.
      // Cette page-ci est le document de premier niveau : son origine ne bouge pas et son
      // stockage est de première partie. Le jeton doit donc vivre ICI. On ne garde qu'une
      // chaîne opaque (aucune donnée lisible), et on ne répond qu'à l'origine Google d'où
      // vient la demande.
      // ⚠ DEUX CLÉS, ET LA SECONDE MANQUAIT DEPUIS LE 2026-09-17. L'app envoie le poste avec
      // le jeton depuis ce jour-là ; cette page l'ignorait et n'en renvoyait aucun. Voir le
      // pavé « CHAQUE KIOSQUE A SON ADRESSE » plus haut : c'est la panne qui faisait repartir
      // toutes les tablettes sur Manutention.
      //
      // Le poste n'est PAS un secret — c'est un nom d'écran, en clair, à côté du jeton qui,
      // lui, est une chaîne opaque. Les deux gardes sont indépendantes : persister un jeton
      // seul ne doit pas effacer le poste, et l'inverse non plus.
      var KIOSK_KEY = 'bpqKioskToken';
      var KIOSK_PAGE_KEY = 'bpqKioskPage';
      function kioskGet() { try { return localStorage.getItem(KIOSK_KEY) || ''; } catch (e) { return ''; } }
      function kioskPageGet() { try { return localStorage.getItem(KIOSK_PAGE_KEY) || ''; } catch (e) { return ''; } }

      addEventListener('message', function (e) {
        if (!origineGoogle(e.origin)) return;
        if (!e.data) return;

        if (e.data.bpq === 'reload') {
          splash.classList.remove('hidden');
          app.src = app.src; // relance un chargement complet sur l'URL /exec
          return;
        }
        if (e.data.bpq === 'kiosk-set') {
          if (typeof e.data.token === 'string' && e.data.token) {
            try { localStorage.setItem(KIOSK_KEY, e.data.token); } catch (err) {}
          }
          // Garde SÉPARÉE, et chaîne vide = « je ne dis rien du poste », pas « efface-le ».
          // C'est ce que l'app promet de son côté (`_kioskPersist_` : « `page` vide n'efface
          // rien »), et les deux doivent le promettre ensemble.
          if (typeof e.data.page === 'string' && e.data.page) {
            try { localStorage.setItem(KIOSK_PAGE_KEY, e.data.page); } catch (err) {}
          }
          return;
        }
        if (e.data.bpq === 'kiosk-clear') {
          try { localStorage.removeItem(KIOSK_KEY); } catch (err) {}
          try { localStorage.removeItem(KIOSK_PAGE_KEY); } catch (err) {}
          return;
        }
        if (e.data.bpq === 'kiosk-get') {
          // Réponse à la fenêtre qui a demandé, sur SON origine — jamais en diffusion.
          // ⚠ L'ADRESSE PASSE DEVANT LE RANGEMENT, et c'est l'app qui tranche (voir
          // `_kioskEnter_`). On répond donc ce qu'on a gardé, sans regarder `?poste=` : deux
          // endroits qui arbitrent la même question finissent par ne plus donner la même
          // réponse, et celui qu'on lit n'est jamais celui qu'on croit.
          try { e.source.postMessage({ bpq: 'kiosk-token', token: kioskGet(), page: kioskPageGet() }, e.origin); } catch (err) {}
          return;
        }
      });
    })();
  </script>
</body>
</html>
