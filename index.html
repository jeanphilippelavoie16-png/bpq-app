<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>BPQ Planification</title>
  <!-- viewport-fit=cover : le contenu s'étend sous la barre de statut / Dynamic Island.
       maximum-scale=1 : empêche le zoom involontaire dans une app plein écran. -->
  <!-- maximum-scale/user-scalable retirés : ils bloquaient le zoom (problème d'accessibilité)
       sans rien apporter en standalone, et sont soupçonnés de perturber viewport-fit=cover. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- ── Le correctif de la barre blanche ──
       Cette page est le document de PREMIER NIVEAU : c'est celle-ci qu'iOS lit pour teindre
       la barre de statut. On la déclare noire, ce que l'enveloppe Apps Script (blanche) ne
       permettait pas. black-translucent = barre de statut transparente par-dessus notre noir. -->
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BPQ">

  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    /* ══ LA BANDE MORTE EN BAS : la cause était `position: fixed` ══
       Mesuré sur l'appareil. Avec l'iframe en position:fixed, iOS standalone donnait
       innerHeight = 812 pour un écran de 874 : un élément fixed est borné au viewport
       de MISE EN PAGE, qui exclut 62px (la hauteur de la Dynamic Island), et rien —
       ni 100vh, ni 100dvh, ni le fond de la racine — n'atteignait cette zone.
       En position:absolute avec une hauteur explicite de screen.height, le document
       dépasse le viewport de mise en page ; iOS étend alors le viewport VISUEL à tout
       l'écran (innerHeight passe à 874, écart 0) et le contenu descend jusqu'au bord.
       Donc : pas de `overflow: hidden` ici (il rognerait ces 62px) et surtout pas de
       retour à position:fixed. */
    html, body { margin: 0; padding: 0; }
    html {
      background-color: #0a0a0a;
      overscroll-behavior: none;   /* pas de rebond sur les 62px de débord */
    }
    body { background: transparent; overscroll-behavior: none; }
    #app {
      position: absolute; top: 0; left: 0;
      width: 100%;                 /* hauteur posée en px par fit() */
      border: 0; background: transparent; display: block;
    }
    /* Splash affiché tant que l'app n'a pas fini de charger (fondu à la fin). */
    #splash {
      position: absolute; top: 0; left: 0; z-index: 2; background: #0a0a0a;
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.45s ease; opacity: 1;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img { width: min(240px, 58vw); height: auto; }

    /* ══ LA DICTÉE — pourquoi elle a besoin d'un écran À ELLE, ici ══
       Le micro ne peut PAS s'ouvrir depuis l'app : la reconnaissance vocale exige que toute
       la chaîne de cadres l'autorise, et l'iframe que HtmlService génère par-dessus la nôtre
       ne relaie pas la permission — ce cadre-là appartient à Google. C'est la même raison qui
       a fait passer le scan de code QR par ici.

       Et il faut un TOUCHER DANS CE DOCUMENT : Safari refuse `recognition.start()` sans
       activation de l'utilisateur sur la page qui demande le micro. Le toucher de l'app a eu
       lieu dans l'iframe — il ne compte pas. D'où ce panneau : son gros bouton EST le geste
       qui ouvre le micro, et il sert en même temps de témoin (« j'écoute », et ce que
       j'entends) sur une tablette tenue avec des gants.

       Couleurs : celles du thème sombre de l'app (bpq-planification, CLAUDE.md § charte) —
       fond #0a0a0a, accent #0189FB, clair #7cc4ff, texte blanc à opacité variable. Rien de neuf. */
    #dictee {
      position: absolute; top: 0; left: 0; z-index: 5; background: #0a0a0a;
      width: 100%;
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 24px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff; text-align: center;
    }
    #dictee.ouvert { display: flex; }
    #dictee .dic-titre { font-size: 19px; font-weight: 600; letter-spacing: -0.2px; }
    #dictee .dic-sous { font-size: 14px; color: rgba(255,255,255,0.55); max-width: 30ch; line-height: 1.45; }
    /* 128px : bien au-delà des 88px du plus gros bouton des kiosques — c'est la seule cible
       de cet écran, et elle se touche avec des gants sans regarder. */
    #dictee .dic-micro {
      width: 128px; height: 128px; border-radius: 50%;
      border: 2px solid #0189FB; background: rgba(1,137,251,0.14);
      color: #fff; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #dictee .dic-micro:active { background: rgba(1,137,251,0.30); }
    #dictee.ecoute .dic-micro { border-color: #7cc4ff; animation: dic-pouls 1.6s ease-in-out infinite; }
    /* ⚠ Nom préfixé `dic-` : les @keyframes sont GLOBALES. Cette page ne partage son document
       avec rien d'autre, mais la règle vaut quand même — elle coûte trois lettres. */
    @keyframes dic-pouls {
      0%, 100% { box-shadow: 0 0 0 0 rgba(1,137,251,0.45); }
      50%      { box-shadow: 0 0 0 18px rgba(1,137,251,0); }
    }
    #dictee .dic-texte {
      font-size: 17px; line-height: 1.5; color: rgba(255,255,255,0.92);
      max-width: 46ch; min-height: 3em; overflow-y: auto; max-height: 34vh;
    }
    #dictee .dic-fini {
      min-height: 56px; padding: 0 30px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.08);
      color: #fff; font-size: 17px; font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }
    #dictee .dic-fini:active { background: rgba(255,255,255,0.16); }
  </style>
</head>
<body>
  <div id="splash"><img src="logo_white.png" alt="BPQ"></div>

  <!-- ── QUEL PROJET APPS SCRIPT CETTE COQUILLE SERT ──
       Repointé le 2026-08-21. Cette ligne visait encore AKfycbzew2Pylre…QEoXMqh, le
       déploiement de l'ANCIEN projet, déclaré obsolète à la bascule du 2026-08-20.
       La coquille servait donc l'app au bandeau rouge — alors les gens ouvraient la
       nouvelle URL /exec directement dans Safari, et tout ce que cette page apporte
       disparaissait d'un coup. Voir demande explicite : « depuis qu'on a switcher à la
       nouvelle app web, la barre blanche est revenu quand j'enregistre comme une app
       dans mon écran d'iPhone et sur la tablette je ne suis plus capable de mettre
       l'app sur le bureau avec le logo et il garde la barre web en tête ».

       Pourquoi l'URL /exec nue ne peut PAS remplacer cette page : là-bas le document
       de premier niveau est l'enveloppe générée par Google, et HtmlService.addMetaTag()
       n'accepte que « viewport » (voir la NOTE dans doGet, Code.js de bpq-planification).
       Donc pas d'apple-touch-icon (iOS met une capture d'écran à la place du logo), pas
       de display standalone (l'icône rouvre le navigateur avec sa barre), pas de
       theme-color (la barre blanche). Les trois symptômes n'en font qu'un : on
       n'installait plus la coquille.

       L'ID ci-dessous est le déploiement EN SERVICE (app.bpq.ca). Il est apparié au
       projet dans bpq-planification/hooks/clasp-cible.ps1 et dans son CLAUDE.md
       § « IL Y A DEUX PROJETS ». Changer de déploiement là-bas sans changer cette
       ligne ici ramène exactement la panne du 2026-08-21 — et rien ne le signalera :
       ce dépôt n'a ni clasp, ni pre-push, ni aucun des 10 contrôles. -->
  <!-- ⚠ PAS DE `src` ICI, ET C'EST VOULU (2026-09-21). L'adresse de /exec se compose plus bas
       avec `?kiosque=<poste>` : la poser en dur ferait partir un PREMIER chargement sans le
       poste, puis un second avec — deux démarrages à froid d'Apps Script (8 à 9 s chacun) à
       chaque ouverture de tablette, et l'écran du mauvais poste entre les deux. L'ID du
       déploiement EN SERVICE vit maintenant dans la constante EXEC du script. -->
  <iframe id="app"
          title="BPQ Planification"
          allow="camera; microphone; clipboard-read; clipboard-write; geolocation; fullscreen"
          allowfullscreen></iframe>

  <!-- ── LE PANNEAU DE DICTÉE ──
       Caché tant que l'app ne le demande pas (message { bpq: 'dicter' }). Il vit ICI et pas
       dans l'app parce que le micro n'existe qu'au premier niveau — voir le bloc CSS #dictee.
       L'icône est « mic » de Lucide, le même tracé que le bouton de l'app (NC_ICO_MICRO dans
       bpq-planification, ui/Js-28) : le même dessin de part et d'autre du pont. -->
  <div id="dictee" role="dialog" aria-modal="true" aria-label="Dictée">
    <div class="dic-titre" id="dicTitre">Toucher le micro et parler</div>
    <button type="button" class="dic-micro" id="dicMicro" aria-label="Parler">
      <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <rect x="9" y="2" width="6" height="13" rx="3"/>
      </svg>
    </button>
    <div class="dic-texte" id="dicTexte"></div>
    <div class="dic-sous" id="dicSous">Ce que tu dis s’écrit dans la fiche. Tu pourras le corriger.</div>
    <button type="button" class="dic-fini" id="dicFini">Terminé</button>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      var app = document.getElementById('app');

      // ═══════════════════════════════════════════════════════════════════════════════════
      // LE POSTE DE CETTE TABLETTE — il vit dans l'ADRESSE, et on le retient
      // ═══════════════════════════════════════════════════════════════════════════════════
      //
      // Demande du 2026-09-21 : « je veux que chaque kiosque s'installe manuellement chacun
      // […] comme ça chaque kiosque est autonome ». On ouvre `…/bpq-app/?poste=usine`, on
      // ajoute à l'écran d'accueil, et cette tablette EST Batching pour toujours.
      //
      // ⛔ CE QUI A RENDU CE LOT NÉCESSAIRE, et il faut le savoir pour ne pas le défaire :
      // le poste vivait DÉJÀ dans le localStorage de cette coquille depuis le 2026-09-17
      // (`bpqKioskPage`) — sauf que ce dépôt-ci n'a jamais reçu sa moitié du lot. Il ignorait
      // le champ que l'app lui envoyait et n'en renvoyait aucun. Toutes les tablettes
      // repartaient donc sur Manutention à chaque redémarrage, quel que soit le poste
      // installé, et rien ne le disait. Quatre jours.
      //
      // ⚠ ET LE MANIFESTE PEUT MANGER L'ADRESSE. `start_url: "./index.html"` : au lancement
      // depuis l'icône, iOS peut repartir de CETTE adresse-là, sans le `?poste=`. On ne parie
      // donc pas dessus — on RETIENT ce que l'adresse a dit, et on le relit quand elle se
      // tait. L'adresse reste prioritaire : rouvrir `?poste=punch` sur une tablette Batching
      // la change, ce qui est le seul moyen de corriger une tablette sans la désinstaller.
      var EXEC = 'https://script.google.com/macros/s/'
               + 'AKfycbxOsJhObowJjHXim2cFl4JN6Uzq2eFrj7B0AZmrxhCwr8FtVIS9ur9y9JT1XPqdPdEh/exec';

      // Les ids sont ceux de KIOSK_POSTES (bpq-planification, ui/Js-01). Deux ne portent pas
      // le nom qu'on dirait : Batching est `usine`, et la TV du Superviseur est `calendrier`.
      var POSTES = { manutention: 'Manutention', production: 'Production',
                     ferrailleur: 'Ferraillage', inspection: 'Inspection',
                     punch: 'Punch', cnckiosque: 'CNC',
                     usine: 'Batching', calendrier: 'Superviseur' };
      var PAGE_KEY = 'bpqKioskPage';

      function posteLire() {
        var v = '';
        try { v = new URLSearchParams(location.search).get('poste') || ''; } catch (e) {}
        v = String(v).trim().toLowerCase();
        // ⚠ UNE ADRESSE INCONNUE NE DÉCIDE RIEN. Pas de repli sur le premier poste : ce serait
        // rejouer la panne qu'on vient de corriger, en plus silencieux encore. L'app refuse le
        // même repli de son côté (`_kiosqueParUrl_`).
        if (POSTES[v]) { try { localStorage.setItem(PAGE_KEY, v); } catch (e) {} return v; }
        try { v = String(localStorage.getItem(PAGE_KEY) || '').trim().toLowerCase(); } catch (e) { v = ''; }
        return POSTES[v] ? v : '';
      }

      var poste = posteLire();

      // ── LE CODE D'USINE, QUAND L'ADRESSE LE PORTE (2026-09-22) ──
      // Pour une fenêtre qui ne garde RIEN entre deux lancements — WebFrame Basic en Single
      // App Mode, le seul mode que la tablette de la TV peut porter, un web clip ne pouvant
      // pas être verrouillé par un MDM. Sans ça, le jeton du kiosque meurt à chaque
      // fermeture et quelqu'un doit monter taper quatre chiffres chaque matin.
      //
      // ⚠ ON NE LE RETIENT PAS, contrairement au poste. Le poste dit ce que la tablette
      // AFFICHE et n'ouvre rien ; le code ouvre les commandes d'écriture. Le garder ici en
      // ferait une copie de plus à oublier quelque part — il vit dans l'adresse, et nulle
      // part ailleurs. Une adresse sans code redevient donc une tablette ordinaire, qui
      // demandera son code : c'est le comportement qu'on veut.
      var code = '';
      try { code = String(new URLSearchParams(location.search).get('code') || '').trim(); } catch (e) {}
      if (!/^[0-9]{4}$/.test(code)) code = '';   // mal formé = rien, jamais une tentative

      var q = [];
      if (poste) q.push('kiosque=' + encodeURIComponent(poste));
      if (code)  q.push('code=' + encodeURIComponent(code));
      app.src = EXEC + (q.length ? '?' + q.join('&') : '');

      // Le nom sous l'icône de l'écran d'accueil : « BPQ Batching », « BPQ Punch »… C'est la
      // dernière occasion de voir qu'on a ouvert la mauvaise adresse avant de taper le code.
      if (poste) {
        document.title = 'BPQ ' + POSTES[poste];
        var mt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (mt) mt.setAttribute('content', 'BPQ ' + POSTES[poste]);
      }

      // ── Hauteur de l'iframe mesurée, pas déduite du CSS ──
      // 100vh/100dvh se comportaient mal selon le mode ; on mesure donc la hauteur
      // réellement visible et on la pose en pixels, re-mesurée au resize et à la rotation.
      function estStandalone() {
        if (navigator.standalone === true) return true;                       // iOS
        try { return matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; }
      }

      function fit() {
        var vv = (window.visualViewport && window.visualViewport.height) || 0;
        var ih = window.innerHeight || 0;
        var sc = window.screen || {};
        var seul = estStandalone();
        var ecran = 0;
        if (sc.height && sc.width) {
          var portrait = ih >= (window.innerWidth || 0);
          ecran = portrait ? Math.max(sc.height, sc.width) : Math.min(sc.height, sc.width);
        }
        // En standalone, l'iframe doit faire la hauteur de l'ÉCRAN : c'est ce débord au-delà
        // du viewport de mise en page qui fait étendre le viewport visuel à tout l'écran.
        // Dans un navigateur, au contraire, la barre d'adresse occupe légitimement le bas :
        // on s'en tient à la hauteur visible, sinon le bas de l'app passe dessous.
        var h = seul ? Math.max(vv, ih, ecran) : Math.max(vv, ih);
        if (!h) return;
        app.style.height = h + 'px';
        splash.style.height = h + 'px';
        // Le panneau de dictée se mesure comme le splash : lui aussi recouvre l'app. ⚠ On le
        // relit ici plutôt que de garder la variable du bloc plus bas — `fit()` tourne AVANT
        // lui au premier passage, et une variable encore vide aurait laissé le panneau haut de
        // son contenu, posé en haut de l'écran.
        var pan = document.getElementById('dictee');
        if (pan) pan.style.height = h + 'px';
        if (diag) {
          diag.textContent = (seul ? 'STANDALONE' : 'navigateur')
            + ' · inner ' + ih + ' · visual ' + Math.round(vv)
            + ' · screen ' + (sc.height || '?') + '×' + (sc.width || '?')
            + ' · dpr ' + (window.devicePixelRatio || '?') + ' → iframe ' + Math.round(h);
        }
      }
      // Lecture des mesures à l'écran, seulement avec ?debug=1 — pour diagnostiquer sur
      // l'appareil sans avoir à le brancher.
      var diag = null;
      if (/[?&]debug=1/.test(location.search)) {
        diag = document.createElement('div');
        diag.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;'
          + 'font:11px/1.4 -apple-system,sans-serif;color:#7cc4ff;background:rgba(0,0,0,0.8);'
          + 'border:1px solid rgba(124,196,255,0.4);border-radius:8px;padding:6px 8px;text-align:center';
        document.body.appendChild(diag);
      }
      fit();
      addEventListener('resize', fit);
      addEventListener('orientationchange', function () { setTimeout(fit, 250); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
      // Le passage en plein écran standalone peut arriver après le premier paint.
      setTimeout(fit, 300);
      setTimeout(fit, 1200);

      // Masque le splash quand l'app est chargée (ou après un délai de sécurité).
      function hide() { splash.classList.add('hidden'); }
      app.addEventListener('load', hide);
      setTimeout(hide, 7000);

      // ── Rechargement demandé par l'app (écran noir au réveil) ──
      // L'app tourne dans l'iframe bac à sable d'Apps Script (`userCodeAppPanel`), dont l'URL
      // est signée et à usage unique : un location.reload() DEPUIS L'INTÉRIEUR retombe souvent
      // sur un cadre vide — l'écran noir dont on ne sortait qu'en redémarrant le téléphone.
      // C'est la coquille qui doit recharger, avec l'URL /exec, elle stable. L'app envoie donc
      // { bpq: 'reload' } (voir _bpqReload_ dans Assignation.html) et on la sert ici.
      //
      // Le message vient du bac à sable INTERNE (googleusercontent.com), pas de l'iframe
      // directe : on ne peut donc pas comparer e.source à app.contentWindow, il faut filtrer
      // sur l'origine. La seule action possible reste de recharger notre propre iframe sur son
      // URL d'origine — aucune donnée n'est lue ni transmise.
      function origineGoogle(o) {
        return o === 'https://script.google.com'
          || /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(o);
      }
      // ── Jeton du poste kiosque (la tablette du chariot élévateur) ──
      // Le stockage de l'app vit dans le bac à sable Apps Script : origine TIERCE, et
      // regénérée à chaque chargement de /exec. Un jeton écrit là ne survit pas au
      // rechargement, et Safari sur iPad refuse même de l'écrire (« Empêcher le suivi entre
      // sites », actif par défaut). C'est ce qui rendait l'installation impossible : la
      // tablette acceptait le code puis revenait à l'écran de connexion.
      // Cette page-ci est le document de premier niveau : son origine ne bouge pas et son
      // stockage est de première partie. Le jeton doit donc vivre ICI. On ne garde qu'une
      // chaîne opaque (aucune donnée lisible), et on ne répond qu'à l'origine Google d'où
      // vient la demande.
      var KIOSK_KEY = 'bpqKioskToken';
      function kioskGet() { try { return localStorage.getItem(KIOSK_KEY) || ''; } catch (e) { return ''; } }
      // Le POSTE voyage à côté du jeton depuis le 2026-09-17, et il a fallu quatre jours pour
      // que cette moitié-ci arrive. Le jeton dit « cette tablette est un kiosque » ; il ne dit
      // pas LEQUEL — il est le même sur toutes les tablettes (`_manutentionKioskToken_` hache
      // le code d'usine et un sel de projet, il n'identifie aucun appareil). Sans le poste, la
      // tablette retombait sur le premier de la table à chaque redémarrage.
      // C'est la même clé que celle de l'adresse plus haut : les deux chemins écrivent au même
      // endroit, donc une tablette installée par l'adresse garde son poste même si l'app le
      // lui renvoie, et l'inverse aussi.
      function pageGet() { try { return localStorage.getItem(PAGE_KEY) || ''; } catch (e) { return ''; } }

      // ═══════════════════════════════════════════════════════════════════════════════════
      // LA DICTÉE — la moitié que ce dépôt n'avait jamais reçue
      // ═══════════════════════════════════════════════════════════════════════════════════
      //
      // Signalé par Samuel le 2026-10-28 : « Sur la tablette inspection, il y a maintenant une
      // pastille à cliquer NC […] Il y a un bouton dicté […] En ce moment, le bouton ne marche
      // pas. » Il ne marchait pas parce que CETTE page ne connaissait pas le message : l'app
      // envoyait { bpq: 'dicter' } depuis le 2026-10-27, personne ne répondait, et au bout de
      // 2,5 s l'app disait « la dictée n'est pas disponible ici ». Elle avait raison.
      //
      // ⛔ C'EST LA TROISIÈME FOIS que cette moitié-ci arrive en retard, et le mode de panne
      // est chaque fois le même : l'app envoie un champ ou un message de plus, cette page
      // l'ignore en silence, et c'est l'usine qui le découvre.
      //   · 2026-08-21 — l'iframe restée sur l'ancien déploiement (quatre jours) ;
      //   · 2026-09-17→21 — le poste qui ne voyageait pas (quatre jours) ;
      //   · 2026-10-27→28 — la dictée, ci-dessous.
      // Depuis ce lot, l'autre dépôt tient la liste des messages qu'il nous envoie et refuse
      // le push pour un message neuf qui n'est pas déclaré ici (voir son
      // hooks/coquille-messages.json). Ça ne publie pas cette page à notre place — ça fait
      // au moins DIRE qu'elle est à publier.
      //
      // LE PROTOCOLE, tel que l'app le parle déjà (bpq-planification, ui/Js-28) :
      //   app  → nous : { bpq: 'dicter', lang }     { bpq: 'dicter-stop' }
      //   nous → app  : { bpq: 'dictee-ouverte' }   l'accusé : « je connais ce message »
      //                 { bpq: 'dictee-texte', texte }   le texte COMPLET, pas un morceau
      //                 { bpq: 'dictee-fin', texte }     le texte complet, et c'est fini
      //                 { bpq: 'dictee-erreur', erreur }
      //
      // ⚠ L'ACCUSÉ PART AVANT LE MICRO, et c'est voulu. Il ne dit pas « j'écoute » : il dit
      // « je suis une coquille qui sait dicter ». La permission du micro, elle, peut demander
      // à l'opérateur de toucher « Autoriser » — bien plus que les 2,5 s que l'app attend.
      // Lier l'accusé au démarrage réel du micro ferait échouer la PREMIÈRE dictée de chaque
      // tablette, celle qui demande la permission, c'est-à-dire exactement celle qu'on
      // installe en espérant que ça marche.
      var Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
      var dictee = null;            // { rec, source, origine, texte, fini } pendant une dictée
      var DIC_MAX = 3000;           // la zone de texte de la fiche en accepte 4000, base comprise
      var dicPan   = document.getElementById('dictee');
      var dicMicro = document.getElementById('dicMicro');
      var dicFini  = document.getElementById('dicFini');
      var dicTexte = document.getElementById('dicTexte');
      var dicTitre = document.getElementById('dicTitre');
      var dicSous  = document.getElementById('dicSous');

      // On ne répond qu'à la fenêtre qui a demandé, sur SON origine — jamais en diffusion.
      // Même règle que `kiosk-get` : un postMessage vers '*' depuis le premier niveau serait
      // lisible par n'importe quel cadre de la page.
      function dicDire(msg) {
        if (!dictee) return;
        try { dictee.source.postMessage(msg, dictee.origine); } catch (e) {}
      }

      function dicFermer() {
        dicPan.classList.remove('ouvert');
        dicPan.classList.remove('ecoute');
        dictee = null;
      }

      // ⚠ UNE LANGUE VENUE DU DEHORS NE SE POSE PAS TELLE QUELLE. Le message vient d'une
      // origine Google, donc de notre app — mais tout ce qui traverse le pont est borné, ici
      // comme dans Montre.js. `fr-CA` est le repli, c'est la langue de l'usine.
      function dicLangue(v) {
        return /^[a-z]{2}(-[A-Za-z]{2})?$/.test(String(v || '')) ? String(v) : 'fr-CA';
      }

      function dicOuvrir(e) {
        // Pas de reconnaissance vocale sur cet appareil : on le DIT, tout de suite. L'app
        // montre alors son message et met le curseur dans le champ — le micro du clavier de
        // l'iPad reste là, et c'est un repli qui marche partout.
        if (!Reco) {
          try { e.source.postMessage({ bpq: 'dictee-erreur', erreur: 'non-supporte' }, e.origin); } catch (err) {}
          return;
        }
        if (dictee) dicArreter(true);
        dictee = { rec: null, source: e.source, origine: e.origin,
                   lang: dicLangue(e.data.lang), texte: '', fini: false };
        dicDire({ bpq: 'dictee-ouverte' });
        dicTitre.textContent = 'Toucher le micro et parler';
        dicSous.textContent = 'Ce que tu dis s’écrit dans la fiche. Tu pourras le corriger.';
        dicTexte.textContent = '';
        dicPan.classList.remove('ecoute');
        dicPan.classList.add('ouvert');
      }

      // LE TOUCHER QUI OUVRE LE MICRO. Il doit avoir lieu DANS ce document : c'est toute la
      // raison d'être du panneau (voir le bloc CSS #dictee).
      function dicDemarrer() {
        if (!dictee || dictee.rec) return;
        var rec;
        try { rec = new Reco(); } catch (e) { dicEchec('non-supporte'); return; }
        rec.lang = dictee.lang;
        // Les deux réglages sont ignorés par certaines versions de Safari, et ce n'est pas
        // grave : sans `continuous`, la reconnaissance s'arrête d'elle-même après un silence,
        // `onend` tombe, et la dictée se termine normalement.
        try { rec.continuous = true; rec.interimResults = true; } catch (e) {}

        rec.onresult = function (ev) {
          // ⚠ `ev.results` est CUMULATIF depuis le début de la dictée : on le relit en entier
          // et on renvoie le texte COMPLET. L'app remplace (base + texte) à chaque message —
          // lui envoyer des morceaux écrirait « Le mur Le mur est Le mur est fissuré ».
          var tout = '';
          for (var i = 0; i < ev.results.length; i++) {
            var r = ev.results[i];
            tout += (r[0] && r[0].transcript) || '';
          }
          dictee.texte = tout.replace(/\s+/g, ' ').trim().slice(0, DIC_MAX);
          dicTexte.textContent = dictee.texte;
          dicDire({ bpq: 'dictee-texte', texte: dictee.texte });
        };
        rec.onstart = function () {
          if (!dictee) return;
          dicPan.classList.add('ecoute');
          dicTitre.textContent = 'J’écoute…';
          dicSous.textContent = 'Touche « Terminé » quand tu as fini.';
        };
        rec.onerror = function (ev) { dicEchec(String((ev && ev.error) || 'erreur')); };
        rec.onend = function () {
          // ⚠ `onend` TOMBE AUSSI APRÈS UNE ERREUR, et une fin vide envoyée derrière l'erreur
          // remettrait le bouton de l'app au repos en effaçant son message d'explication —
          // soit exactement l'allure d'un bouton cassé. Deux gardes s'y opposent, et CHACUNE
          // suffit : `dicEchec` pose `fini`, et sa fermeture vide `dictee`. Mesuré en les
          // retirant une à une — le banc ne crie que si les deux tombent. C'est voulu : la
          // fermeture est là pour l'écran, le drapeau pour le protocole, et aucun des deux
          // n'est à garder « parce que l'autre pourrait partir ».
          if (!dictee || dictee.fini) { dicFermer(); return; }
          dictee.fini = true;
          dicDire({ bpq: 'dictee-fin', texte: dictee.texte });
          dicFermer();
        };
        dictee.rec = rec;
        try { rec.start(); } catch (e) { dicEchec('not-allowed'); }
      }

      function dicEchec(quoi) {
        if (!dictee || dictee.fini) return;
        dictee.fini = true;
        dicDire({ bpq: 'dictee-erreur', erreur: quoi });
        dicFermer();
      }

      // `muet` : on referme sans rien dire à l'app — le seul cas est une deuxième demande de
      // dictée qui remplace la première, et l'app n'a pas à recevoir la fin de celle-là.
      function dicArreter(muet) {
        if (!dictee) return;
        if (muet) dictee.fini = true;
        var rec = dictee.rec;
        if (!rec) { if (muet) { dicFermer(); return; } dicEchec('no-speech'); return; }
        try { muet ? rec.abort() : rec.stop(); } catch (e) {}
        if (muet) dicFermer();
      }

      dicMicro.addEventListener('click', dicDemarrer);
      dicFini.addEventListener('click', function () { dicArreter(false); });

      addEventListener('message', function (e) {
        if (!origineGoogle(e.origin)) return;
        if (!e.data) return;

        if (e.data.bpq === 'reload') {
          splash.classList.remove('hidden');
          app.src = app.src; // relance un chargement complet sur l'URL /exec
          return;
        }
        if (e.data.bpq === 'kiosk-set') {
          // ⚠ DEUX GARDES SÉPARÉES, JAMAIS IMBRIQUÉES. L'app persiste parfois un jeton avec
          // `page: ''` (voir `_kioskPersist_`) : imbriquer ferait perdre le poste à ce
          // moment-là, et on ne s'en apercevrait qu'au redémarrage suivant.
          if (typeof e.data.token === 'string' && e.data.token) {
            try { localStorage.setItem(KIOSK_KEY, e.data.token); } catch (err) {}
          }
          if (typeof e.data.page === 'string' && e.data.page) {
            try { localStorage.setItem(PAGE_KEY, e.data.page); } catch (err) {}
          }
          return;
        }
        if (e.data.bpq === 'kiosk-clear') {
          // Quitter le kiosque efface TOUT : garder le poste ferait rouvrir l'écran d'un poste
          // sur une tablette qu'on vient de libérer.
          try { localStorage.removeItem(KIOSK_KEY); } catch (err) {}
          try { localStorage.removeItem(PAGE_KEY); } catch (err) {}
          return;
        }
        if (e.data.bpq === 'dicter') { dicOuvrir(e); return; }
        if (e.data.bpq === 'dicter-stop') { dicArreter(false); return; }
        if (e.data.bpq === 'kiosk-get') {
          // Réponse à la fenêtre qui a demandé, sur SON origine — jamais en diffusion.
          // `page` s'ajoute au jeton : une app d'avant ce lot ignore le champ en trop, et
          // celle d'aujourd'hui s'en sert quand l'adresse n'a rien dit.
          try {
            e.source.postMessage({ bpq: 'kiosk-token', token: kioskGet(), page: pageGet() }, e.origin);
          } catch (err) {}
          return;
        }
      });
    })();
  </script>
</body>
</html>
